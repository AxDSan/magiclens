# GitHub Pages (branch main, folder /): README.md becomes the home page, and the privacy
# policy and terms are served from the same files the extension ships.
title: MagicLens
description: Read, select, translate and explain the text inside any image, right where it appears.
theme: jekyll-theme-cayman

defaults:
  - scope:
      path: PRIVACY.md
    values:
      permalink: /privacy/
  - scope:
      path: TERMS.md
    values:
      permalink: /terms/

exclude:
  - src/
  - tests/
  - scripts/
  - public/
  - assets/
  - store/
  - node_modules/
  - package.json
  - package-lock.json
  - tsconfig.json
  - "*.config.ts"
  - LICENSE
