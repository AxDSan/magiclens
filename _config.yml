# GitHub Pages (branch main, folder /): index.html is the landing page; the privacy policy,
# terms and changelog are rendered from the same files the extension ships, with the site's
# own layout.
title: MagicLens
description: Read, select, translate and explain the text inside any image, right where it appears.

defaults:
  - scope:
      path: PRIVACY.md
    values:
      layout: legal
      permalink: /privacy/
  - scope:
      path: TERMS.md
    values:
      layout: legal
      permalink: /terms/
  - scope:
      path: CHANGELOG.md
    values:
      layout: legal
      permalink: /changelog/

exclude:
  - src/
  - tests/
  - scripts/
  - public/
  - store/
  - node_modules/
  - package.json
  - package-lock.json
  - tsconfig.json
  - "*.config.ts"
  - LICENSE
  - README.md
